# /etc/nginx/sites-available/relay.wedgie.dev: the wedgie relay (wedgie-relay.service, port 8796).
# certbot --nginx -d relay.wedgie.dev adds the TLS blocks.
server {
  server_name relay.wedgie.dev;
  location / {
    proxy_pass http://127.0.0.1:8796;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 90s;
  }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/relay.wedgie.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/relay.wedgie.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = relay.wedgie.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  server_name relay.wedgie.dev;
  listen 80;
  listen [::]:80;
    return 404; # managed by Certbot


}