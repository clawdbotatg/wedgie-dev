# xcodegen spec: `xcodegen generate` here → Wedgie.xcodeproj (gitignored). README.md has the build + install.
name: Wedgie
options:
  bundleIdPrefix: dev.wedgie
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: XX7QP5899Z
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wedgie:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: wedgie
        CFBundleName: Wedgie
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wedgie.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
