<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wedgie.dev</title>
<meta name="description" content="Give yourself a wedgie: a pocket computer from three off-the-shelf parts. Order one, build one, plug it in and put software on it. MIT everything.">
<meta name="theme-color" content="#fefefe">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:title" content="wedgie.dev">
<meta property="og:description" content="Give yourself a wedgie. A pocket computer from three off-the-shelf parts. MIT everything.">
<meta property="og:image" content="https://wedgie.dev/img/og.png">
<style>
/* The loader. Same picture as the device's boot screen (picowallet firmware/splash.py + loader.py):
   the logo box 96x77 above the plastic bar shell 150x30, 15 px apart, on white. All sizes are
   device pixels times --u, so the proportions match tools/bar exactly. */
html, body { margin: 0; background: #fefefe; }
#wl { position: fixed; inset: 0; z-index: 100; background: #fefefe; display: grid; place-items: center;
  --u: min(calc(100vw / 240 * 1.35), calc(100vh / 240 * 1.1), 3.4px); }
#wl .col { display: flex; flex-direction: column; align-items: center; transform: translateY(calc(var(--u) * 15)); }
#wl img { width: calc(var(--u) * 96); height: calc(var(--u) * 77); display: block; }
#wl .shell { margin-top: calc(var(--u) * 15); width: calc(var(--u) * 150); height: calc(var(--u) * 30); box-sizing: border-box;
  border-radius: 999px; position: relative;
  background: linear-gradient(#ffffff, #e8e9eb);
  box-shadow: inset 0 calc(var(--u) * 1.5) 0 #fff, inset 0 calc(var(--u) * -1.5) 0 rgba(205,206,208,.6),
    calc(var(--u) * 1) calc(var(--u) * 4) calc(var(--u) * 8) rgba(0,0,0,.2); }
#wl .track { position: absolute; left: calc(var(--u) * 11); right: calc(var(--u) * 11); top: calc(var(--u) * 7); bottom: calc(var(--u) * 7);
  border-radius: 999px; background: linear-gradient(#c0c1c3, #dadbdd);
  box-shadow: inset 0 calc(var(--u) * 2.5) calc(var(--u) * 1.5) rgba(70,70,72,.45), 0 0 0 var(--u) #e1e2e4; }
#wl .fill { position: absolute; left: calc(var(--u) * 2); top: calc(var(--u) * 2); bottom: calc(var(--u) * 2);
  width: calc(var(--u) * 12); border-radius: 999px; overflow: hidden;
  background: linear-gradient(#7c7d7f, #48494b);
  box-shadow: inset 0 calc(var(--u) * -1.2) 0 rgba(40,40,42,.47), calc(var(--u) * .5) calc(var(--u) * 1.5) calc(var(--u) * 1.5) rgba(40,40,42,.43); }
#wl .fill::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 40%; border-radius: 999px;
  background: linear-gradient(rgba(255,255,255,.2), rgba(255,255,255,0)); }
#wl.done .fill { background: linear-gradient(#46cd64, #168c34); }
#wl .fill.empty { visibility: hidden; }
#wl noscript, #wl .msg { position: absolute; bottom: 24px; font: 15px/1.4 system-ui, sans-serif; color: #6b6e6b; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<div id="wl" role="progressbar" aria-label="Loading wedgie.dev" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="col">
    <img src="%LOADER_LOGO%" alt="wedgie.dev">
    <div class="shell"><div class="track"><div class="fill empty"></div></div></div>
  </div>
  <noscript>wedgie.dev needs JavaScript.</noscript>
</div>
<div id="app"></div>
<script>
// Fetch everything the site needs with byte progress, fill the bar grey by bytes, then load the app,
// turn the bar green, and go. Mirrors firmware/loader.py: fill by each file's share of the
// total size, green when done, wiped when the app shows its first screen.
(function () {
  var files = __MANIFEST__;
  var el = document.getElementById("wl"), fill = el.querySelector(".fill"), track = el.querySelector(".track");
  var total = 0, got = 0, shown = 0, target = 0, finished = false, fetched = false, appUp = false;
  function maybeDone() { if (fetched && appUp) { target = 1; finished = true; } }
  window.__wedgieReady = function () { appUp = true; maybeDone(); };
  files.forEach(function (f) { total += f.n || 1; });
  function draw() {
    shown = target;                       // the bar is the real progress: no easing
    var w = track.clientWidth, h = track.clientHeight, pad = h / 8, fh = h - 2 * pad;
    fill.style.width = (fh + (w - 2 * pad - fh) * shown) + "px";
    if (shown > 0) fill.classList.remove("empty");
    el.setAttribute("aria-valuenow", Math.round(shown * 100));
    if (shown < 1 || !finished) requestAnimationFrame(draw); else green();
  }
  function green() {                      // green for one frame, then straight to the site: no hold, no fade
    el.classList.add("done");
    requestAnimationFrame(function () {
      document.documentElement.classList.add("ready");
      el.remove();
    });
  }
  function fetchOne(f) {
    return fetch(f.u, { credentials: "same-origin" }).then(function (r) {
      if (!r.ok || !r.body) { got += f.n || 1; target = got / total; return; }
      var reader = r.body.getReader(), mine = 0;
      function pump() {
        return reader.read().then(function (x) {
          if (x.done) { got += Math.max(0, (f.n || 1) - mine); target = Math.min(1, got / total); return; }
          var n = Math.min(x.value.byteLength, Math.max(0, (f.n || 1) - mine));
          mine += n; got += n; target = Math.min(0.999, got / total);
          return pump();
        });
      }
      return pump();
    }).catch(function () { got += f.n || 1; });
  }
  requestAnimationFrame(draw);
  Promise.all(files.map(fetchOne)).then(function () {
    files.filter(function (f) { return f.t === "css"; }).forEach(function (f) {
      var l = document.createElement("link"); l.rel = "stylesheet"; l.crossOrigin = ""; l.href = f.u; document.head.appendChild(l);
    });
    var js = files.filter(function (f) { return f.t === "js"; });
    fetched = true; maybeDone();
    // Dev server: Vite injects its own module script, which calls __wedgieReady when the app is up.
    js.forEach(function (f) { import(f.u).catch(function (e) {
      el.insertAdjacentHTML("beforeend", '<div class="msg">Something did not load. Reload the page.</div>'); console.error(e);
    }); });
  });
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
